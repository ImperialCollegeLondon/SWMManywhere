<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SWMManywhere">
  <!-- A small drainage tree: hollow manholes upstream, a pipe that widens as it
       collects flow, and a filled outfall at the bottom, on the docs' cyan. -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#26d1e5"/>
      <stop offset="1" stop-color="#0b7d8e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 15 L32 31" stroke-width="3"/>
    <path d="M47 16 L32 31" stroke-width="3"/>
    <path d="M13 27 L32 31" stroke-width="3"/>
    <path d="M32 31 L32 48" stroke-width="5.5"/>
  </g>
  <g fill="url(#bg)" stroke="#ffffff" stroke-width="2.6">
    <circle cx="16" cy="15" r="3.4"/>
    <circle cx="47" cy="16" r="3.4"/>
    <circle cx="13" cy="27" r="3.4"/>
    <circle cx="32" cy="31" r="3.9"/>
  </g>
  <circle cx="32" cy="50" r="5.2" fill="#ffffff"/>
</svg>
